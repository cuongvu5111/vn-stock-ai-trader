# Ngày tạo: 2026-11-03
# Cập nhật: 2026-11-17 — cứng hóa cho LAN: chạy không root (cổng 8080), header bảo mật, rate limit đăng nhập,
#   giới hạn kích thước body, cache tài nguyên có hash, endpoint /health.
# Mục đích: Phục vụ Angular Dashboard và reverse proxy /api sang FastAPI backend (tên service nội bộ `trading-backend`).
# File này được nạp vào ngữ cảnh `http` của nginx.conf mặc định (conf.d/default.conf).

# Đăng nhập: tối đa 10 lần/phút/IP (burst 5) để chặn dò mật khẩu; lockout theo tài khoản do backend đảm nhiệm.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# API chung: đủ rộng cho dashboard (nhiều request song song khi tải trang) nhưng chặn lạm dụng đơn giản.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Body mặc định nhỏ; riêng import CSV được nới ở location bên dưới.
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Chỉ nén tài nguyên tĩnh (không nén JSON của API để tránh các tấn công BREACH lên phản hồi chứa token).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # DNS nội bộ của Docker + biến upstream: nginx phân giải lại tên backend, không giữ IP cũ khi container backend được tạo lại
    # và vẫn khởi động được khi backend chưa sẵn sàng.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://trading-backend:8000;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness của chính nginx (dùng cho healthcheck Docker); không ghi access log để tránh nhiễu.
    location = /health {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Đăng nhập có rate limit riêng.
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Import CSV gửi dạng JSON `csv_content` nên cần body lớn hơn mặc định.
    location = /api/v1/market/imports {
        client_max_body_size 10m;
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Tài nguyên build có hash trong tên (vd. main-XK3HET55.js): bất biến, cache 1 năm.
    location ~ "^/[^/]+-[A-Za-z0-9]{8,}\.(?:js|css)$" {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html không cache để bản build mới (tên file hash mới) có hiệu lực ngay.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Không phục vụ file ẩn.
    location ~ /\. {
        return 404;
    }

    # SPA fallback: route Angular không có file thật thì trả index.html (đã gắn no-cache ở location trên).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
