# Ngày tạo: 2026-11-17
# Mục đích: Header bảo mật dùng chung. Nginx chỉ kế thừa add_header từ cấp ngoài khi location KHÔNG tự khai báo add_header,
#   nên file này được include ở server và ở mọi location có add_header riêng (cache, no-store...).
# Lưu ý: hệ thống chạy HTTP trong LAN nên cố ý KHÔNG đặt HSTS/upgrade-insecure-requests (sẽ làm hỏng truy cập qua http://IP:cổng).
#   style-src cần 'unsafe-inline' vì Angular chèn <style> cho component; script-src giữ 'self' (build production không có script inline,
#   angular.json đã tắt inlineCritical để không sinh thuộc tính onload inline).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
