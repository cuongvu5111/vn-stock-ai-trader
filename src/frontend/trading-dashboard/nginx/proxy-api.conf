# Ngày tạo: 2026-11-17
# Mục đích: Tham số reverse proxy dùng chung cho mọi location chuyển tiếp sang FastAPI backend.
# Lý do:
#   - Host cố định là tên service nội bộ để TRUSTED_HOSTS của backend không phụ thuộc IP/tên LAN mà người dùng gõ;
#     Host gốc vẫn được giữ trong X-Forwarded-Host.
#   - X-Forwarded-For dùng $remote_addr (không nối thêm giá trị client gửi lên) vì nginx là cổng ngoài cùng, tránh giả mạo IP.

proxy_pass $backend_upstream;
proxy_http_version 1.1;
proxy_set_header Host trading-backend;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_redirect off;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 300s;

# Dữ liệu API (có xác thực) không được lưu cache ở trình duyệt hay proxy trung gian.
include /etc/nginx/snippets/security-headers.conf;
add_header Cache-Control "no-store" always;
